<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Region SRE Status Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #0f172a; color: #f8fafc; }
        .card { max-width: 600px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .status { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SRE Global Infrastructure Portal</h1>
        <p>Target Environment: <span class="status">ACTIVE / HEALTHY (Multi-Region AKS)</span></p>
        <p>Managed via Terraform, Automated via GitHub Actions, Observed via Prometheus & Grafana.</p>
    </div>
</body>
</html>
